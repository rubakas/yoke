version: "3.9"

# ─── Yoke node stack (ADR-0007) ──────────────────────────────────────────────
# Start with: docker compose up -d
# Secure remote access via Tailscale or SSH (ADR-0007).

services:
  # ── LiteLLM proxy — Layer-0 key isolation (ADR-0004) ──────────────────────
  # Real provider keys live here only. Yoke sees only LITELLM_VIRTUAL_KEY.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: --config /app/config.yaml
    depends_on:
      - postgres
    restart: unless-stopped

  # ── Postgres — LiteLLM virtual-key store ──────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Arize Phoenix — observability / tracing (ADR-0005) ────────────────────
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006" # UI + OTLP/HTTP
      - "4317:4317" # OTLP/gRPC
    restart: unless-stopped

  # ── Yoke orchestrator (placeholder — uncomment in Stage 2) ────────────────
  # orchestrator:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   # The Dockerfile will bundle Node ≥22, Pi CLI, and the `claude` CLI.
  #   # Pi drives Claude Code as a sub-agent via pi-claude-cli (ADR-0006).
  #   environment:
  #     LITELLM_VIRTUAL_KEY: ${LITELLM_VIRTUAL_KEY}
  #     LITELLM_BASE_URL: http://litellm:4000/v1
  #     PHOENIX_OTLP_URL: http://phoenix:6006/v1/traces
  #     YOKE_DB_PATH: /data/yoke.sqlite
  #   volumes:
  #     - yoke_data:/data
  #   depends_on:
  #     - litellm
  #     - phoenix
  #   restart: unless-stopped

volumes:
  postgres_data:
